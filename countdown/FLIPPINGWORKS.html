<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Animation</title>
  <style>
    /* Font */
    @font-face {
      font-family: 'Pinyon Script';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(https://fonts.gstatic.com/s/pinyonscript/v23/6xKpdSJbL9-e9LuoeQiDRQR8WOraOrbh.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Pinyon Script';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(https://fonts.gstatic.com/s/pinyonscript/v23/6xKpdSJbL9-e9LuoeQiDRQR8WOXaOg.woff2) format('woff2');
    }

    /* Container */
    #EnvelopeContainer {
      transform: scale(0.8);
      perspective: 1000px;
      margin: 0;
      position: relative;
      display: none;
    }

    #EnvelopeFlip {
      width: 100%;
      transition: transform 2s ease;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    #EnvelopeFrontWrap {
      backface-visibility: hidden;
      position: relative;
      width: 100%;
      z-index: 1000;
    }

    .text {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: 'Pinyon Script', cursive;
      color: #113c25;
      text-align: center;
      font-size: 7vmin;
      margin: 0;
    }

    #EnvelopeBack {
      backface-visibility: hidden;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    #EnvelopeFold {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
    }

    #EnvelopeSealWrap {
      position: absolute;
      top: 0;
      left: 0;             
      width: 100%;
      height: 100%;
      object-fit: none;
      transform-origin: top center;
      transition: transform 1500ms ease;
      perspective: 1000px;
      z-index: 3;
    }

    #EnvelopeSealWrap.opened {
      transform: rotateX(-180deg);
    }

    .seal-img, .flap-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      transition: opacity 750ms ease-in-out;
      opacity: 1;
      z-index: 2;
    }

    .seal-img.hidden {
      opacity: 0;
    }

    .flip, #EnvelopeBack {
      transform: rotateY(180deg);
    }

    .envContents {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    #ContentsStack {
      position: absolute;
      bottom: 0; 
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    #EnvelopeContent {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .envContents2 {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      bottom: 0;
      object-fit: cover;
    }

    /* Assign stacking + positions */
    .envContents2:nth-child(1) {
      --n: 1;
      --top-pos: -5%;
      z-index: 5;
    }
    .envContents2:nth-child(2) {
      --n: 2;
      --top-pos: -10%;
      z-index: 4;
    }
    .envContents2:nth-child(3) {
      --n: 3;
      --top-pos: -15%;
      z-index: 3;
    }
    .envContents2:nth-child(4) {
      --n: 4;
      --top-pos: -20%;
      z-index: 2;
    }
    .envContents2:nth-child(5) {
      --n: 5;
      --top-pos: -25%;
      z-index: 1;
    }

    /* Animation trigger */
    .slid {
      animation: slideUp 800ms forwards ease-out;
      animation-delay: calc((var(--n, 1) - 1) * 0.4s);
    }

    /* Keyframes */
    @keyframes slideUp {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(var(--top-pos));
      }
    }
    @keyframes pullout {
  0% {
    transform: translateY(0) rotate(0deg) scale(1);
  }
  100% {
    transform: translateY(var(--move-up)) rotate(0deg) scale(1.5);
  }
}

.pullout {
  animation: pullout 0.8s ease forwards;
}
  </style>
</head>
<body>
  <section style="width:100vw; display:flex; flex-direction:column; align-items:center; justify-content:space-around; text-align:center; background-color:black">
    <h1 class="title" style="color:white; font-family: Times New Roman, serif">STACKING IN PROGRESS!!!!!</h1>

    <div id="EnvelopeContainer">
      <div id="EnvelopeFlip">
        <!-- Front -->
        <div id="EnvelopeFrontWrap">
          <img id="FrontPage" src="../images/FrontPage.png" class="envContents" style="z-index: -1;">
          <img src="../images/EnvelopeMaterials/EnvelopeFront.png" style="width:100%; height:100%; display:block; z-index:2;" alt="Envelope Front" id="EnvelopeFront"> 
          <p class="text" style="top:50%; left:50%; z-index:3;">To our favourite people;</p>
        </div>

        <!-- Back -->
        <div id="EnvelopeBack">
          <div id="EnvelopeSealWrap">
            <img id="EnvelopeSealOld" class="seal-img" src="../images/EnvelopeMaterials/EnvelopeBackPlain.png">
            <img src="../images/EnvelopeMaterials/EnvelopeBackFlapMask.png" style="z-index:0;" class="flap-img">          
            <img id="EnvelopeSealNew" class="seal-img hidden" src="../images/EnvelopeMaterials/EnvelopeBackFlapOpen.png">
            <p class="text" style="top:20%; left:50%; z-index:3;">You're invited!</p>
          </div>

          <div id="ContentsStack">
            <div id="EnvelopeContent">
              <img id="Page1" src="../images/BG4.jpg" class="envContents2">
              <img id="Page2" src="../images/image_1.jpg" class="envContents2">
              <img id="Page3" src="../images/BG1.jpg" class="envContents2">
              <img id="Page4" src="../images/SPACEBETWEEN.jpg" class="envContents2">
              <img id="Page5" src="../images/SPACEBETWEENEXT.png" class="envContents2">
            </div>
          </div>

          <img src="../images/EnvelopeMaterials/EnvelopeBackBottom.png" id="EnvelopeFold">
          <img id="ThirdPage" src="../images/BG4.jpg" class="envContents" style="z-index:-1;">
        </div>
      </div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const images = document.querySelectorAll('#EnvelopeContainer img');
      let loadedImages = 0;

      function checkImagesLoaded() {
        loadedImages++;
        if (loadedImages === images.length) {
          document.getElementById('EnvelopeContainer').style.display = 'block';
          initAnimation();
        }
      }

      images.forEach(function(img) {
        img.addEventListener('load', checkImagesLoaded);
        if (img.complete) checkImagesLoaded();
      });

      function initAnimation() {
        const envelopeFlip = document.getElementById('EnvelopeFlip');
        const sealWrap = document.getElementById('EnvelopeSealWrap');
        const sealOldImg = document.getElementById('EnvelopeSealOld');
        const sealNewImg = document.getElementById('EnvelopeSealNew');
        const foldImg = document.getElementById('EnvelopeFold');
        const ContentsStack = document.getElementById('ContentsStack');

        const foldHeight = foldImg.offsetHeight;
        const sealHeight = sealOldImg.offsetHeight;
        const newSealImgHeight = foldHeight + sealHeight + 'px';

function animateEnvelope() {
  envelopeFlip.removeEventListener('click', animateEnvelope);
  envelopeFlip.removeEventListener('touchstart', animateEnvelope);
  envelopeFlip.classList.add('flip');

  // First transition on envelope flip
  envelopeFlip.addEventListener('transitionend', function() {
    sealWrap.classList.add('opened');
    sealNewImg.style.height = newSealImgHeight; // remove quotes, assuming it's a variable
    sealOldImg.style.height = newSealImgHeight;
    sealOldImg.classList.add('hidden');
    sealNewImg.classList.remove('hidden');
  }, { once: true });

  // Second transition on seal wrap
  sealWrap.addEventListener('transitionend', function() {
    document.getElementById("ThirdPage").style.display = 'none';
    document.getElementById("EnvelopeFold").style.zIndex = '1000';
    document.getElementById("EnvelopeSealWrap").style.zIndex = '-1';

    ContentsStack.style.display = "block";
    document.querySelectorAll('.envContents2').forEach(img => {
      img.classList.add('slid');
    });

    // Wait for .envContents2 elements to finish sliding
    document.querySelectorAll('.envContents2').forEach(img => {
      img.addEventListener('transitionend', function() {
        img.classList.add('pullout');
      }, { once: true });
    });
  }, { once: true });
}
        envelopeFlip.addEventListener('click', animateEnvelope);
        envelopeFlip.addEventListener('touchstart', animateEnvelope);
      }
    });
  </script>
</body>
</html>
